<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>H5 Tab 点击滚动到中间 · 顶部横向 + 侧边纵向</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: #e9ebf0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            color: #222;
        }

        h1 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .tip {
            font-size: 12px;
            color: #888;
            margin-bottom: 14px;
        }

        /* 手机外壳 */
        .phone {
            width: 360px;
            max-width: 92vw;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .section-label {
            padding: 10px 14px 6px;
            font-size: 13px;
            font-weight: 700;
            color: #555;
            background: #fafafa;
        }

        /* ===== 顶部横向 tab：点击后横向居中 ===== */
        .top-tabs {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid #eee;
            scrollbar-width: none;
        }

        .top-tabs::-webkit-scrollbar {
            display: none;
        }

        .top-tabs .tab {
            flex: 0 0 auto;
            padding: 12px 18px;
            font-size: 14px;
            color: #666;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: color .2s;
        }

        .top-tabs .tab.active {
            color: #ff5000;
            font-weight: 700;
        }

        .top-tabs .tab.active::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 6px;
            width: 20px;
            height: 3px;
            border-radius: 2px;
            background: #ff5000;
            transform: translateX(-50%);
        }

        /* ===== 侧边纵向 tab + 右侧内容：点击后纵向居中，且双向联动 ===== */
        .side-layout {
            display: flex;
            height: 300px;
        }

        .side-tabs {
            width: 92px;
            flex: 0 0 92px;
            overflow-y: auto;
            background: #f5f6f8;
            scrollbar-width: none;
        }

        .side-tabs::-webkit-scrollbar {
            display: none;
        }

        .side-tabs .tab {
            padding: 16px 8px;
            font-size: 13px;
            text-align: center;
            color: #666;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: background .2s, color .2s;
        }

        .side-tabs .tab.active {
            background: #fff;
            color: #ff5000;
            font-weight: 700;
        }

        .side-tabs .tab.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 3px;
            height: 18px;
            border-radius: 2px;
            background: #ff5000;
            transform: translateY(-50%);
        }

        .side-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            scrollbar-width: thin;
        }

        .side-content .panel {
            margin-bottom: 12px;
        }

        .side-content .panel h3 {
            font-size: 13px;
            color: #333;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px dashed #eee;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .card-grid .card {
            background: #f7f8fa;
            border-radius: 8px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #999;
        }

        .footnote {
            font-size: 11px;
            color: #aaa;
            padding: 8px 14px;
            background: #fafafa;
        }
    </style>
</head>

<body>
    <h1>H5 Tab 点击滚动到中间</h1>
    <p class="tip">点击顶部 / 侧边 tab：被选中的 tab 自动滚到可视区正中；侧边与右侧内容双向联动</p>

    <div class="phone">
        <!-- ① 顶部横向 tab -->
        <div class="section-label">① 顶部横向 Tab（点击 → 横向居中）</div>
        <div class="top-tabs" id="topTabs"></div>

        <!-- ② 侧边纵向 tab + 右侧内容 -->
        <div class="section-label">② 侧边纵向 Tab（点击 → 纵向居中，并滚动到对应内容）</div>
        <div class="side-layout">
            <div class="side-tabs" id="sideTabs"></div>
            <div class="side-content" id="sideContent"></div>
        </div>

        <div class="footnote">
            右侧内容向下滚动时，左侧 tab 会自动高亮并跟随滚动居中（scroll-spy 双向联动）。
        </div>
    </div>

    <script>
        /**
         * 核心：把某个元素滚动到其滚动容器的"正中间"
         * 用 getBoundingClientRect 计算元素中心与容器中心的差值，加到当前 scrollLeft/scrollTop 上。
         * 这样不依赖 offsetParent，嵌套/带 padding 也准确；边界处浏览器会自动 clamp 到最大可滚动值。
         * @param {HTMLElement} container 滚动容器
         * @param {HTMLElement} el        目标（容器内的子元素）
         * @param {'x'|'y'}   axis       滚动方向
         * @param {boolean}   smooth      是否平滑
         */
        function scrollToCenter(container, el, axis = 'x', smooth = true) {
            const cRect = container.getBoundingClientRect()
            const eRect = el.getBoundingClientRect()
            let delta
            if (axis === 'x') {
                delta = (eRect.left + eRect.width / 2) - (cRect.left + cRect.width / 2)
                container.scrollTo({ left: container.scrollLeft + delta, behavior: smooth ? 'smooth' : 'auto' })
            } else {
                delta = (eRect.top + eRect.height / 2) - (cRect.top + cRect.height / 2)
                container.scrollTo({ top: container.scrollTop + delta, behavior: smooth ? 'smooth' : 'auto' })
            }
        }

        // 简单节流，避免 scroll-spy 每像素都算
        function throttle(fn, wait = 80) {
            let last = 0, timer = null
            return function (...args) {
                const now = Date.now()
                if (now - last >= wait) {
                    last = now
                    fn.apply(this, args)
                } else {
                    clearTimeout(timer)
                    timer = setTimeout(() => { last = Date.now(); fn.apply(this, args) }, wait)
                }
            }
        }

        // ---------- ① 顶部横向 tab ----------
        ; (function initTopTabs() {
            const box = document.getElementById('topTabs')
            const names = ['推荐', '手机数码', '家用电器', '服饰鞋包', '美妆护肤', '食品生鲜', '母婴玩具', '运动户外', '图书文娱', '家居家装', '电脑办公']
            box.innerHTML = names.map((n, i) =>
                `<div class="tab${i === 0 ? ' active' : ''}" data-i="${i}">${n}</div>`).join('')

            box.addEventListener('click', (e) => {
                const tab = e.target.closest('.tab')
                if (!tab) return
                box.querySelector('.tab.active')?.classList.remove('active')
                tab.classList.add('active')
                scrollToCenter(box, tab, 'x', true)   // 点击后横向居中
            })

            // 初始把选中的 tab 居中（无动画）
            const firstActive = box.querySelector('.tab.active')
            if (firstActive) requestAnimationFrame(() => scrollToCenter(box, firstActive, 'x', false))
        })()

            // ---------- ② 侧边纵向 tab + 内容双向联动 ----------
            ; (function initSideTabs() {
                const tabsBox = document.getElementById('sideTabs')
                const contentBox = document.getElementById('sideContent')
                const cats = ['热销榜', '手机', '电脑', '数码', '家电', '服饰', '鞋包', '美妆', '食品', '生鲜', '母婴', '图书']

                tabsBox.innerHTML = cats.map((c, i) =>
                    `<div class="tab${i === 0 ? ' active' : ''}" data-i="${i}">${c}</div>`).join('')

                // 每个分类一段内容，卡片数量随机以形成不同高度
                contentBox.innerHTML = cats.map((c, i) => {
                    const cards = Array.from({ length: 4 + (i % 3) }, (_, k) => `<div class="card">${c}·商品${k + 1}</div>`).join('')
                    return `<div class="panel" id="panel-${i}" data-i="${i}"><h3>${c}</h3><div class="card-grid">${cards}</div></div>`
                }).join('')

                const panels = [...contentBox.querySelectorAll('.panel')]
                let lockSpy = false // 点击 tab 触发内容滚动时，暂时关闭 scroll-spy，避免高亮来回跳

                // 选中某个侧边 tab：高亮 + 纵向居中 + 滚到对应内容段
                function activateTab(tabEl, panelEl, smooth = true) {
                    tabsBox.querySelector('.tab.active')?.classList.remove('active')
                    tabEl.classList.add('active')
                    scrollToCenter(tabsBox, tabEl, 'y', smooth) // 侧边纵向居中
                    if (panelEl) {
                        lockSpy = true
                        contentBox.scrollTo({ top: panelEl.offsetTop - contentBox.offsetTop, behavior: smooth ? 'smooth' : 'auto' })
                        // 内容平滑滚动结束后再放开锁（无动画时立即放开）
                        setTimeout(() => { lockSpy = false }, smooth ? 420 : 0)
                    }
                }

                tabsBox.addEventListener('click', (e) => {
                    const tab = e.target.closest('.tab')
                    if (!tab) return
                    activateTab(tab, panels[+tab.dataset.i], true)
                })

                // scroll-spy：内容滚动时，反推当前段落对应 tab 高亮并纵向居中
                contentBox.addEventListener('scroll', throttle(() => {
                    if (lockSpy) return
                    const top = contentBox.scrollTop + 8 // 顶部留一点判定余量
                    let cur = panels[0]
                    for (const p of panels) {
                        if (p.offsetTop - contentBox.offsetTop <= top) cur = p
                        else break
                    }
                    const tab = tabsBox.querySelector(`.tab[data-i="${cur.dataset.i}"]`)
                    if (tab && !tab.classList.contains('active')) {
                        tabsBox.querySelector('.tab.active')?.classList.remove('active')
                        tab.classList.add('active')
                        scrollToCenter(tabsBox, tab, 'y', true) // 跟随居中
                    }
                }, 80))

                // 初始选中项纵向居中（无动画）
                const firstActive = tabsBox.querySelector('.tab.active')
                if (firstActive) requestAnimationFrame(() => scrollToCenter(tabsBox, firstActive, 'y', false))
            })()
    </script>
</body>

</html>
