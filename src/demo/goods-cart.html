<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 · jQuery + Vue3 购物车</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f5f6fa;
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 24px;
        }

        h1 {
            font-size: 20px;
            color: #2f3542;
            margin-bottom: 20px;
        }

        /* 商品列表（jQuery 渲染） */
        .goods-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            max-width: 1000px;
        }

        .goods-item {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .goods-thumb {
            height: 120px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            background: #f1f2f6;
        }

        .goods-name {
            font-size: 15px;
            color: #2f3542;
        }

        .goods-price {
            font-size: 16px;
            color: #e84118;
            font-weight: 600;
        }

        .goods-actions {
            display: flex;
            gap: 8px;
        }

        .goods-actions button {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .goods-actions button:hover {
            opacity: 0.85;
        }

        .btn-add-cart {
            background: #ffa502;
            color: #fff;
        }

        .btn-buy-now {
            background: #e84118;
            color: #fff;
        }

        /* 购物车（Vue3 渲染） */
        #cart-app {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            background: #e84118;
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
        }

        .cart-toggle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            font-size: 22px;
            cursor: pointer;
        }

        .cart-panel {
            margin-top: 10px;
            width: 320px;
            max-height: 70vh;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cart-panel h2 {
            font-size: 15px;
            padding: 14px 16px;
            border-bottom: 1px solid #f1f2f6;
            color: #2f3542;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
        }

        .cart-empty {
            padding: 30px 0;
            text-align: center;
            color: #a4b0be;
            font-size: 13px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px dashed #f1f2f6;
        }

        .cart-item-thumb {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-size: 13px;
            color: #2f3542;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-price {
            font-size: 12px;
            color: #e84118;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-controls button {
            width: 22px;
            height: 22px;
            border: 1px solid #dfe4ee;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            line-height: 1;
        }

        .cart-item-remove {
            border: none;
            background: none;
            color: #a4b0be;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
        }

        .cart-footer {
            padding: 12px 16px;
            border-top: 1px solid #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-total {
            font-size: 14px;
            color: #2f3542;
        }

        .cart-total b {
            color: #e84118;
        }

        .cart-checkout {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background: #e84118;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .cart-checkout:disabled {
            background: #dfe4ee;
            color: #a4b0be;
            cursor: not-allowed;
        }

        /* 轻提示 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(47, 53, 66, 0.9);
            color: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 200;
            display: none;
        }

        /* 防止 Vue 挂载前页面短暂显示 {{ }} 原始插值 */
        [v-cloak] {
            display: none;
        }
    </style>
</head>

<body>
    <h1>商品列表</h1>

    <!-- 商品列表：jQuery 渲染 -->
    <div class="goods-list" id="goodsList"></div>

    <!-- 购物车：Vue3 渲染，直接写在页面里（In-DOM 模板，Vue 取挂载点 innerHTML 作模板） -->
    <div id="cart-app" v-cloak>
        <button class="cart-toggle" @click="open = !open" title="购物车">🛒</button>
        <span class="cart-badge" v-if="totalCount > 0">{{ totalCount }}</span>

        <div class="cart-panel" v-if="open">
            <h2>购物车（{{ totalCount }} 件）</h2>
            <div class="cart-items">
                <div class="cart-empty" v-if="items.length === 0">购物车是空的</div>
                <div class="cart-item" v-for="item in items" :key="item.id">
                    <div class="cart-item-thumb">{{ item.thumb }}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">{{ item.name }}</div>
                        <div class="cart-item-price">¥{{ (item.price * item.qty).toFixed(2) }}</div>
                    </div>
                    <div class="qty-controls">
                        <button @click="changeQty(item.id, -1)">−</button>
                        <span>{{ item.qty }}</span>
                        <button @click="changeQty(item.id, 1)">+</button>
                    </div>
                    <button class="cart-item-remove" @click="removeItem(item.id)" title="删除">✕</button>
                </div>
            </div>
            <div class="cart-footer" v-if="items.length > 0">
                <div class="cart-total">合计：<b>¥{{ totalPrice.toFixed(2) }}</b></div>
                <button class="cart-checkout" @click="checkout">去结算</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 模拟商品数据
        const goodsData = [
            { id: 1, name: '无线蓝牙耳机', price: 199, thumb: '🎧' },
            { id: 2, name: '机械键盘', price: 349, thumb: '⌨️' },
            { id: 3, name: '智能手表', price: 899, thumb: '⌚' },
            { id: 4, name: '便携咖啡机', price: 259, thumb: '☕' },
            { id: 5, name: '桌面绿植', price: 69, thumb: '🪴' },
            { id: 6, name: '双肩背包', price: 159, thumb: '🎒' },
        ];

        // jQuery 轻提示
        let toastTimer = null;
        function showToast(msg) {
            $('#toast').stop(true, true).text(msg).fadeIn(150);
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $('#toast').fadeOut(300), 1500);
        }

        // ========== jQuery：渲染商品列表 ==========
        $(function () {
            const $list = $('#goodsList');
            const html = goodsData.map(g => `
                <div class="goods-item" data-id="${g.id}">
                    <div class="goods-thumb">${g.thumb}</div>
                    <div class="goods-name">${g.name}</div>
                    <div class="goods-price">¥${g.price.toFixed(2)}</div>
                    <div class="goods-actions">
                        <button class="btn-add-cart">加入购物车</button>
                        <button class="btn-buy-now">去结算</button>
                    </div>
                </div>
            `).join('');
            $list.html(html);

            // 事件委托，点击时通过 cartApi 把商品交给 Vue 购物车
            $list.on('click', '.btn-add-cart', function () {
                const id = Number($(this).closest('.goods-item').data('id'));
                const goods = goodsData.find(g => g.id === id);
                window.cartApi.addToCart(goods);
                showToast(`已加入购物车：${goods.name}`);
            });

            $list.on('click', '.btn-buy-now', function () {
                const id = Number($(this).closest('.goods-item').data('id'));
                const goods = goodsData.find(g => g.id === id);
                window.cartApi.buyNow(goods);
            });
        });

        // ========== Vue3：渲染右上角购物车 ==========
        const { createApp, ref, computed, watch } = Vue;

        const CartApp = {
            // 不写 template，Vue 默认取挂载元素 #cart-app 的 innerHTML 作为模板（In-DOM 模板）
            setup() {
                const items = ref([]);   // { id, name, price, thumb, qty }
                const open = ref(false);

                const totalCount = computed(() => items.value.reduce((s, i) => s + i.qty, 0));
                const totalPrice = computed(() => items.value.reduce((s, i) => s + i.price * i.qty, 0));

                function addToCart(goods) {
                    const found = items.value.find(i => i.id === goods.id);
                    if (found) {
                        found.qty += 1;
                    } else {
                        items.value.push({ ...goods, qty: 1 });
                    }
                    // 新加入时自动展开面板，形成“右上角弹出”效果
                    open.value = true;
                }

                function buyNow(goods) {
                    addToCart(goods);
                    checkout();
                }

                function changeQty(id, delta) {
                    const item = items.value.find(i => i.id === id);
                    if (!item) return;
                    item.qty += delta;
                    if (item.qty <= 0) removeItem(id);
                }

                function removeItem(id) {
                    items.value = items.value.filter(i => i.id !== id);
                }

                function checkout() {
                    if (items.value.length === 0) return;
                    alert(`结算成功！共 ${totalCount.value} 件商品，合计 ¥${totalPrice.value.toFixed(2)}`);
                    items.value = [];
                    open.value = false;
                }

                // 暴露给 jQuery 侧调用
                window.cartApi = { addToCart, buyNow };

                // 购物车有商品时角标提醒（演示 watch 用法）
                watch(totalCount, (n, o) => {
                    if (n > 0 && o === 0) console.log('购物车已从空变为有商品');
                });

                return { items, open, totalCount, totalPrice, changeQty, removeItem, checkout };
            },
        };

        createApp(CartApp).mount('#cart-app');
    </script>
</body>

</html>
